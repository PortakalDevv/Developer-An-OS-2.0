    1
  );


  pushHistory();

  renderPanel();

}


function updateEventTrigger(
  index,
  trigger
) {

  selectedElement.events[index]
    .trigger =
    trigger;

  if (trigger === "commandMatch" && !selectedElement.events[index].command) {
    selectedElement.events[index].command = "help";
  }

  if (trigger === "valueMatch" && !selectedElement.events[index].command) {
    selectedElement.events[index].command = "100";
  }


  pushHistory();

  renderPanel();

}


function updateEventCommand(
  index,
  command
) {

  selectedElement.events[index].command = command;

  pushHistory();

}


function addAction(
  eventIndex
) {

  const action = {

    type:
      selectedElement.type === "terminal"
        ? "printTerminal"
        : selectedElement.type === "switch"
          ? "toggleSwitch"
          : "setText",

    target:
      selectedElement.type === "terminal"
        ? selectedElement.id
        : selectedElement.type === "switch"
          ? selectedElement.id
          : getDefaultTarget(),

    value:
      selectedElement.type === "terminal"
        ? "Komut çalıştırıldı."
        : "Merhaba!"

  };


  selectedElement
    .events[eventIndex]
    .actions.push(
      action
    );


  pushHistory();

  renderPanel();

}


function removeAction(
  eventIndex,
  actionIndex
) {

  selectedElement
    .events[eventIndex]
    .actions.splice(
      actionIndex,
      1
    );


  pushHistory();

  renderPanel();

}


function changeActionType(
  eventIndex,
  actionIndex,
  type
) {

  const action =
    selectedElement
      .events[eventIndex]
      .actions[actionIndex];


  action.type =
    type;


  if (type === "setText") {

    action.target =
      getDefaultTarget();

    action.value =
      "Yeni metin";

    delete action.screen;
    delete action.title;

  }


  if (type === "printTerminal") {

    action.target =
      selectedElement.type === "terminal"
        ? selectedElement.id
        : getDefaultTerminalTarget();

    action.value =
      "Komut yanıtı burada gözükecek.";

    delete action.screen;
    delete action.title;

  }


  if (type === "navigate") {

    action.screen =
      project.screens[0]?.id;

    delete action.target;
    delete action.value;
    delete action.title;

  }


  if (
    type === "show" ||
    type === "hide"
  ) {

    action.target =
      getDefaultTarget();

    delete action.screen;
    delete action.value;
    delete action.title;

  }


  if (type === "toggleSwitch") {

    action.target =
      selectedElement.type === "switch"
        ? selectedElement.id
        : getDefaultSwitchTarget();

    delete action.screen;
    delete action.value;
    delete action.title;

  }


  if (type === "toast") {

    action.value = "İşlem başarılı!";

    delete action.target;
    delete action.screen;
    delete action.title;

  }


  if (type === "changeColor") {

    action.target = selectedElement.id;
    action.value = "#16a34a";

    delete action.screen;
    delete action.title;

  }


  if (type === "notificationBanner") {

    action.title = "DevOS";
    action.value = "Yeni bildirim mesajı";

    delete action.target;
    delete action.screen;

  }


  if (type === "controlCenter") {

    delete action.target;
    delete action.screen;
    delete action.value;
    delete action.title;

  }


  pushHistory();

  renderPanel();

}


function updateActionValue(
  eventIndex,
  actionIndex,
  property,
  value
) {

  selectedElement
    .events[eventIndex]
    .actions[actionIndex][property] =
    value;


  pushHistory();

}


/* =========================================================
   DEFAULT TARGET
========================================================= */

function getDefaultTarget() {

  const screen =
    getCurrentScreen();


  const target =
    screen.elements.find(
      element =>
        element.id !==
        selectedElement?.id &&
        (
          element.type === "text" ||
          element.type === "button" ||
          element.type === "heading" ||
          element.type === "label" ||
          element.type === "badge" ||
          element.type === "slider" ||
          element.type === "osDialog"
        )
    );


  return target
    ? target.id
    : "";

}


function getDefaultSwitchTarget() {

  const screen =
    getCurrentScreen();


  const target =
    screen.elements.find(
      element =>
        element.type === "switch"
    );


  return target
    ? target.id
    : "";

}


function getDefaultTerminalTarget() {

  const screen =
    getCurrentScreen();


  const target =
    screen.elements.find(
      element =>
        element.type === "terminal"
    );


  return target
    ? target.id
    : "";

}


/* =========================================================
   RUN EVENT
========================================================= */

function runEvent(
  element,
  trigger,
  matchValue = null
) {

  if (!element.events) return;


  const events =
    element.events.filter(
      event => {
        if (event.trigger !== trigger) return false;
        if ((trigger === "commandMatch" || trigger === "valueMatch") && matchValue !== null) {
          return String(event.command || "").trim() === String(matchValue).trim();
        }
        return true;
      }
    );


  events.forEach(
    event => {

      if (!event.actions) return;


      event.actions.forEach(
        action => {

          executeAction(
            action
          );

        }
      );

    }
  );

}


/* =========================================================
   EXECUTE ACTION
========================================================= */

function executeAction(
  action
) {

  /* SET TEXT */

  if (
    action.type === "setText"
  ) {

    for (
      const screen
      of project.screens
    ) {

      const target =
        screen.elements.find(
          element =>
            element.id ===
            action.target
        );


      if (target) {

        if (target.type === "osDialog") {
          target.dialogTitle = action.value || "";
        } else {
          target.text = action.value || "";
        }

      }

    }


    renderCanvas();

  }


  /* PRINT TO TERMINAL */

  else if (
    action.type === "printTerminal"
  ) {

    const targetNode = document.querySelector(`.canvas-element[data-id="${action.target}"] .terminal-output`);

    if (targetNode) {

      targetNode.textContent += `\n${action.value || ""}`;

      targetNode.scrollTop = targetNode.scrollHeight;

    }

  }


  /* NAVIGATE */

  else if (
    action.type === "navigate"
  ) {

    switchScreen(
      action.screen,
      true
    );

  }


  /* SHOW */

  else if (
    action.type === "show"
  ) {

    const target =
      findElement(
        action.target
      );


    if (target) {

      target.hidden =
        false;

      renderCanvas();

    }

  }


  /* HIDE */

  else if (
    action.type === "hide"
  ) {

    const target =
      findElement(
        action.target
      );


    if (target) {

      target.hidden =
        true;

      renderCanvas();

    }

  }


  /* TOGGLE SWITCH */

  else if (
    action.type === "toggleSwitch"
  ) {

    const target =
      findElement(
        action.target
      );


    if (
      target &&
      target.type === "switch"
    ) {

      target.checked =
        !target.checked;


      renderCanvas();

      runEvent(
        target,
        target.checked
          ? "switchOn"
          : "switchOff"
      );

    }

  }


  /* TOAST */

  else if (
    action.type === "toast"
  ) {

    toast(
      action.value || "Bildirim"
    );

  }


  /* CHANGE COLOR */

  else if (
    action.type === "changeColor"
  ) {

    for (
      const screen
      of project.screens
    ) {

      const target =
        screen.elements.find(
          element =>
            element.id ===
            action.target
        );


      if (target) {

        target.background =
          action.value || "#2563eb";

      }

    }


    renderCanvas();

  }


  /* NOTIFICATION BANNER */

  else if (
    action.type === "notificationBanner"
  ) {

    showNotificationBanner(
      action.title || "DevOS",
      action.value || "Yeni bildirim"
    );

  }


  /* CONTROL CENTER */

  else if (
    action.type === "controlCenter"
  ) {

    toggleControlCenter();

  }

}


/* =========================================================
   FIND ELEMENT
========================================================= */

function findElement(id) {

  for (
    const screen
    of project.screens
  ) {

    const found =
      screen.elements.find(
        element =>
          element.id === id
      );


    if (found) {
      return found;
    }

  }


  return null;

}


/* =========================================================
   SCREEN SWITCH
========================================================= */

function switchScreen(
  id,
  fromEvent = false
) {

  const exists =
    project.screens.some(
      screen =>
        screen.id === id
    );


  if (!exists) return;


  project.currentScreen =
    id;


  selectedElement =
    null;


  const phoneScreen =
    document.getElementById(
      "phoneScreen"
    );


  phoneScreen.classList.remove(
    "screen-changing",
    "anim-slide",
    "anim-fade",
    "anim-zoom",
    "anim-slide-up",
    "anim-flip",
    "anim-bounce"
  );


  void phoneScreen.offsetWidth;


  const screen = getCurrentScreen();
  const anim = screen.transition || "slide";

  phoneScreen.classList.add(
    "screen-changing",
    "anim-" + anim
  );


  render();


  if (!fromEvent) {

    pushHistory();

  }

}


/* =========================================================
   SCREEN MODAL
========================================================= */

function openScreenModal() {

  document
    .getElementById(
      "screenModal"
    )
    .classList.add("show");


  document
    .getElementById(
      "newScreenName"
    )
    .focus();

}


function closeScreenModal() {

  document
    .getElementById(
      "screenModal"
    )
    .classList.remove("show");

}


function createScreen() {

  const input =
    document.getElementById(
      "newScreenName"
    );


  const name =
    input.value.trim();


  if (!name) {

    toast(
      "Ekran adı gir."
    );

    return;

  }


  const id =
    createUniqueScreenId(
      name
    );


  project.screens.push({

    id,

    name,

    background:
      "#111827",

    transition: "slide",

    elements: []

  });


  project.currentScreen =
    id;


  selectedElement =
    null;


  input.value =
    "";


  closeScreenModal();

  pushHistory();

  render();


  toast(
    "Ekran oluşturuldu ✓"
  );

}


function createUniqueScreenId(
  name
) {

  let base =
    name
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      );


  if (!base) {
    base = "Screen";
  }


  let id =
    base;

  let number =
    2;


  while (
    project.screens.some(
      screen =>
        screen.id === id
    )
  ) {

    id =
      base + "_" + number++;

  }


  return id;

}


/* =========================================================
   DELETE SELECTED
========================================================= */

function deleteSelected() {

  if (!selectedElement) return;


  const screen =
    getCurrentScreen();


  const index =
    screen.elements.findIndex(
      element =>
        element.id ===
        selectedElement.id
    );


  if (index === -1) return;


  screen.elements.splice(
    index,
    1
  );


  clearTimeout(
    spinnerTimers[selectedElement.id]
  );

  delete spinnerTimers[
    selectedElement.id
  ];

  clearInterval(
    activeClockIntervals[selectedElement.id]
  );

  delete activeClockIntervals[
    selectedElement.id
  ];


  selectedElement =
    null;


  pushHistory();

  render();

  toast(
    "Element silindi"
  );

}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSelected() {

  if (!selectedElement) return;


  const screen =
    getCurrentScreen();


  const copy =
    JSON.parse(
      JSON.stringify(
        selectedElement
      )
    );


  copy.id =
    copy.id +
    "_copy_" +
    Date.now()
      .toString(36);


  copy.x += 15;

  copy.y += 15;


  screen.elements.push(
    copy
  );


  selectedElement =
    copy;


  pushHistory();

  render();

  toast(
    "Element kopyalandı"
  );

}


/* =========================================================
   PREVIEW
========================================================= */

function togglePreview() {

  previewMode =
    !previewMode;


  document.body.classList.toggle(
    "preview-mode",
    previewMode
  );


  const button =
    document.getElementById(
      "previewButton"
    );


  if (previewMode) {

    button.textContent =
      "■ Düzenle";

    button.classList.remove(
      "primary"
    );


    selectedElement =
      null;


    renderCanvas();


    toast(
      "Önizleme modu"
    );

  }

  else {

    Object.keys(
      spinnerTimers
    ).forEach(
      id => {

        clearTimeout(
          spinnerTimers[id]
        );

        delete spinnerTimers[id];

      }
    );

    Object.keys(
      activeClockIntervals
    ).forEach(
      id => {

        clearInterval(
          activeClockIntervals[id]
        );

        delete activeClockIntervals[id];

      }
    );


    button.textContent =
      "▶ Önizle";

    button.classList.add(
      "primary"
    );


    render();

    toast(
      "Düzenleme modu"
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveProject() {

  try {

    localStorage.setItem(
      "devos_project",
      JSON.stringify(
        project
      )
    );


    toast(
      "Proje kaydedildi ✓"
    );

  }

  catch (error) {

    console.error(error);

    toast(
      "Kaydetme başarısız"
    );

  }

}


/* =========================================================
   LOAD
========================================================= */

function loadProject() {

  try {

    const saved =
      localStorage.getItem(
        "devos_project"
      );


    if (!saved) return;


    const data =
      JSON.parse(
        saved
      );


    if (
      data &&
      Array.isArray(
        data.screens
      )
    ) {

      project =
        data;

    }

  }

  catch (error) {

    console.error(
      "Proje yüklenemedi:",
      error
    );

  }

}


/* =========================================================
   EXPORT
========================================================= */

function exportProject() {

  const json =
    JSON.stringify(
      project,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    "devos-project.json";


  document.body.appendChild(
    a
  );

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );


  toast(
    "JSON dışa aktarıldı"
  );

}


/* =========================================================
   HISTORY
========================================================= */

function pushHistory() {

  const snapshot =
    JSON.stringify(
      project
    );


  if (
    historyIndex >= 0 &&
    history[historyIndex] ===
      snapshot
  ) {

    return;

  }


  history =
    history.slice(
      0,
      historyIndex + 1
    );


  history.push(
    snapshot
  );


  historyIndex =
    history.length - 1;


  if (
    history.length > 50
  ) {

    history.shift();

    historyIndex--;

  }

}


function undo() {

  if (
    historyIndex <= 0
  ) {

    toast(
      "Geri alınacak işlem yok"
    );

    return;

  }


  historyIndex--;


  project =
    JSON.parse(
      history[historyIndex]
    );


  selectedElement =
    null;


  render();


  toast(
    "Geri alındı"
  );

}


function redo() {

  if (
    historyIndex >=
    history.length - 1
  ) {

    toast(
      "İleri alınacak işlem yok"
    );

    return;

  }


  historyIndex++;


  project =
    JSON.parse(
      history[historyIndex]
    );


  selectedElement =
    null;


  render();


  toast(
    "İleri alındı"
  );

}


/* =========================================================
   TIME
========================================================= */

function updateTime() {

  const now =
    new Date();


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  document.getElementById(
    "statusTime"
  ).textContent =
    hours + ":" + minutes;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      1500
    );

}


/* =========================================================
   NOTIFICATION BANNER SYSTEM
========================================================= */

let notifTimer;

function showNotificationBanner(title, message) {
  const banner = document.getElementById("notificationBanner");
  document.getElementById("notifTitle").textContent = title;
  document.getElementById("notifMessage").textContent = message;

  banner.classList.add("show");

  clearTimeout(notifTimer);

  notifTimer = setTimeout(() => {
    banner.classList.remove("show");
  }, 2500);
}


/* =========================================================
   CONTROL CENTER SYSTEM
========================================================= */

function toggleControlCenter() {
  const cc = document.getElementById("controlCenter");
  cc.classList.toggle("show");
}

function closeControlCenter() {
  const cc = document.getElementById("controlCenter");
  cc.classList.remove("show");
}

function toggleCCTile(tile) {
  tile.classList.toggle("active");
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}


/* =========================================================
   HIDDEN ELEMENT SUPPORT
========================================================= */

const originalCreateElementNode =
  createElementNode;


function renderCanvasWithHiddenSupport() {

  renderCanvas();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ) {

      event.preventDefault();

      saveProject();

    }


    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "z"
    ) {

      event.preventDefault();

      undo();

    }


    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "y"
    ) {

      event.preventDefault();

      redo();

    }


    if (
      event.key === "Delete" &&
      selectedElement &&
      !previewMode
    ) {

      deleteSelected();

    }

  }
);


/* =========================================================
   PATCH HIDDEN RENDER
========================================================= */

const oldRenderCanvas =
  renderCanvas;


renderCanvas =
  function() {

    const screen =
      getCurrentScreen();

    const canvas =
      document.getElementById(
        "canvas"
      );

    const phoneScreen =
      document.getElementById(
        "phoneScreen"
      );


    canvas.innerHTML =
      "";


    phoneScreen.style.background =
      screen.background ||
      "#111827";

    if (screen.backgroundImage) {
      phoneScreen.style.backgroundImage = `url(${screen.backgroundImage})`;
      phoneScreen.style.backgroundSize = "cover";
      phoneScreen.style.backgroundPosition = "center";
    } else {
      phoneScreen.style.backgroundImage = "none";
    }


    screen.elements.forEach(
      element => {

        if (element.hidden && !previewMode) {
          const node = createElementNode(element);
          node.style.opacity = "0.35";
          canvas.appendChild(node);
          return;
        }

        if (element.hidden && previewMode) {
          return;
        }


        const node =
          createElementNode(
            element
          );


        canvas.appendChild(
          node
        );

      }
    );

  };


/* =========================================================
   SCREEN BACKGROUND & TRANSITION FUNCTIONS
========================================================= */

function updateScreenBgColor(val) {
  const screen = getCurrentScreen();
  screen.background = val;
  pushHistory();
  renderCanvas();
}

function updateScreenTransition(val) {
  const screen = getCurrentScreen();
  screen.transition = val;
  pushHistory();
  toast("Geçiş animasyonu güncellendi");
}

function selectScreenImage() {
  document.getElementById("screenImageFile").click();
}

function handleScreenImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const screen = getCurrentScreen();
    screen.backgroundImage = e.target.result;
    pushHistory();
    render();
    toast("Arka plan resmi eklendi ✓");
  };
  reader.readAsDataURL(file);
  input.value = "";
}

function removeScreenBgImage() {
  const screen = getCurrentScreen();
  screen.backgroundImage = "";
  pushHistory();
  render();
  toast("Arka plan resmi kaldırıldı");
}


/* =========================================================
   START
========================================================= */

render();
