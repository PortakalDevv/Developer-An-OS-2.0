<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>DevOS Mobile Studio v1.49.0</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b12;
  color: #fff;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* TOP BAR */

.topbar {
  height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  background: #0d111b;
  border-bottom: 1px solid #202838;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 15px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 99px;
  background: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
}

.top-actions {
  display: flex;
  gap: 5px;
}

.top-btn {
  border: 0;
  color: white;
  background: #182131;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 12px;
}

.top-btn.primary {
  background: #2563eb;
}

/* WORKSPACE */

.workspace {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 20px 10px 220px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(circle at 50% 0%, #172033 0%, #080b12 55%);
}

/* EDITOR */

.phone {
  width: min(1100px, 100%);
  height: 800px;
  max-width: 100%;
  flex-shrink: 0;
  background: #111827;
  border: 1px solid #273444;
  border-radius: 12px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.35);
  overflow: hidden;
  position: relative;
}

.phone-screen {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: #111827;
}

.statusbar {
  display: none;
}

/* CANVAS */

.canvas-element {
  position: absolute;
  overflow: hidden;
  user-select: none;
}

.editor-selected {
  outline: 2px solid #3b82f6 !important;
  outline-offset: 2px;
}

.canvas-element img {
  pointer-events: none;
}

/* COMPONENTS */

.el-text {
  display: flex;
  align-items: center;
  padding: 2px;
  white-space: pre-wrap;
  word-break: break-word;
}

.el-heading {
  display: flex;
  align-items: center;
  padding: 2px;
  font-size: 24px;
  font-weight: 700;
  white-space: pre-wrap;
  word-break: break-word;
}

.el-label {
  display: flex;
  align-items: center;
  padding: 2px;
  color: #cbd5e1;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}

.el-button {
  border: 0;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 4px 8px;
  font-weight: 600;
  overflow: hidden;
}

.el-button img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.el-button.image-top {
  flex-direction: column;
}

.el-button.image-only img {
  width: 100%;
  height: 100%;
}

.el-input {
  width: 100%;
  height: 100%;
  border: 1px solid #374151;
  background: #111827;
  color: white;
  padding: 8px 10px;
  outline: none;
}

.el-textarea {
  width: 100%;
  height: 100%;
  border: 1px solid #374151;
  background: #111827;
  color: white;
  padding: 8px 10px;
  outline: none;
  resize: none;
  border-radius: 8px;
}

.el-card {
  background: #1a2230;
  border: 1px solid #2b3648;
  border-radius: 12px;
}

.el-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.el-progress-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
}

.el-progress {
  width: 100%;
  height: 8px;
  background: #263244;
  border-radius: 99px;
  overflow: hidden;
}

.el-progress-bar {
  height: 100%;
  background: #2563eb;
  border-radius: 99px;
}

.el-nav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #111827;
  border-top: 1px solid #263244;
}

.el-sidebar {
  width: 100%;
  height: 100%;
  background: #111827;
  border-right: 1px solid #263244;
  padding: 10px;
}

.el-tabbar {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #111827;
  border-top: 1px solid #263244;
}

.el-terminal {
  width: 100%;
  height: 100%;
  background: #050505;
  color: #4ade80;
  padding: 10px;
  font-family: monospace;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid #1e293b;
}

.terminal-output {
  flex: 1;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.terminal-input-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  border-top: 1px solid #1e293b;
  padding-top: 4px;
  margin-top: 4px;
}

.terminal-prompt {
  color: #38bdf8;
}

.terminal-input {
  background: transparent;
  border: 0;
  color: #4ade80;
  outline: none;
  flex: 1;
  font-family: monospace;
  font-size: 11px;
}

.el-checkbox,
.el-radio {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  color: white;
}

.el-checkbox input,
.el-radio input {
  width: 18px;
  height: 18px;
}

.el-switch {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
}

.el-switch-track {
  width: 48px;
  height: 26px;
  border-radius: 99px;
  background: #334155;
  position: relative;
  transition: .2s;
}

.el-switch-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  transition: .2s;
}

.el-switch.on .el-switch-track {
  background: #2563eb;
}

.el-switch.on .el-switch-thumb {
  left: 25px;
}

/* LIQUID GLASS SLIDER STYLES */

.el-liquid-slider-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 12px;
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.05)
    );

  border: 1px solid rgba(255,255,255,.22);

  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 8px 25px rgba(0,0,0,.2);
}

.el-liquid-slider-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: #e2e8f0;
  margin-bottom: 6px;
  padding: 0 2px;
}

.el-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  outline: none;
  cursor: pointer;
}

.el-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #38bdf8;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: transform .1s;
}

.el-slider::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

.preview-mode .el-slider {
  pointer-events: auto !important;
}

.el-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2563eb;
  color: white;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
}

.el-divider {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
}

.el-divider-line {
  width: 100%;
  height: 1px;
  background: #334155;
}

.el-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #2563eb;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  overflow: hidden;
}

.el-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.el-spinner {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.el-spinner-circle {
  width: 28px;
  height: 28px;
  border: 3px solid #334155;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.el-list {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111827;
}

.el-list-item {
  padding: 9px 10px;
  border-bottom: 1px solid #263244;
  color: #e2e8f0;
  font-size: 12px;
}

.el-scrollview {
  width: 100%;
  height: 100%;
  overflow: auto;
  background: #111827;
  padding: 10px;
  color: white;
}

.el-modal {
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.el-modal-box {
  width: 90%;
  min-height: 100px;
  background: #1a2230;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 15px;
  color: white;
}

.el-dropdown {
  width: 100%;
  height: 100%;
  border: 1px solid #374151;
  background: #111827;
  color: white;
  border-radius: 8px;
  padding: 6px 8px;
}

.el-video,
.el-audio {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ZAMAN SAYACI (TIMER) STYLES */
.el-timer {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 6px;
  font-family: monospace;
  font-size: 22px;
  font-weight: 700;
  color: #38bdf8;
  letter-spacing: 2px;
}

/* OS DIALOG & ALERT BOX STYLES */
.el-os-dialog {
  width: 100%;
  height: 100%;
  background: rgba(30, 41, 59, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 18px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.el-os-dialog-header {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 6px;
  text-align: center;
}

.el-os-dialog-body {
  font-size: 11px;
  color: #cbd5e1;
  text-align: center;
  line-height: 1.4;
  margin-bottom: 12px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.el-os-dialog-actions {
  display: flex;
  gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 10px;
}

.el-os-dialog-btn {
  flex: 1;
  padding: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: 0.15s;
}

.el-os-dialog-btn.cancel {
  background: rgba(255, 255, 255, 0.08);
  color: #94a3b8;
}

.el-os-dialog-btn.confirm {
  background: #2563eb;
  color: #ffffff;
}

/* PIN ELEMENT STYLES */
.el-pin {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #111827;
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 10px;
  gap: 10px;
}

.pin-dots {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.pin-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid #64748b;
  background: transparent;
  transition: 0.15s;
}

.pin-dot.filled {
  background: #38bdf8;
  border-color: #38bdf8;
}

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  width: 100%;
  max-width: 150px;
}

.pin-key-btn {
  background: #1e293b;
  border: 0;
  color: white;
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pin-key-btn:active {
  background: #2563eb;
}


/* =========================================================
   LIQUID GLASS ELEMENTS
========================================================= */

.el-liquid-glass,
.el-liquid-glass-button,
.el-liquid-glass-card,
.el-liquid-glass-nav,
.el-liquid-glass-tabbar,
.el-liquid-glass-modal {
  width: 100%;
  height: 100%;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.18),
      rgba(255,255,255,.06)
    );

  border: 1px solid rgba(255,255,255,.22);

  backdrop-filter:
    blur(18px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(150%);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    0 10px 35px rgba(0,0,0,.18);

  padding: 10px;
}

.el-liquid-glass {
  border-radius: 18px;
}

.el-liquid-glass-button {
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
  transition:
    transform .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

.el-liquid-glass-button:active {
  transform: scale(.97);
}

.el-liquid-glass-card {
  border-radius: 20px;
  justify-content: flex-start;
  align-items: flex-start;
  text-align: left;
}

.el-liquid-glass-nav {
  border-radius: 18px;
  justify-content: space-around;
}

.el-liquid-glass-tabbar {
  border-radius: 20px;
  justify-content: space-around;
}

.el-liquid-glass-modal {
  border-radius: 24px;
  padding: 18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 20px 55px rgba(0,0,0,.32);
}


/* EDITOR PANEL */

.bottom-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2000;
  background: #0c111a;
  border-top: 1px solid #263244;
  box-shadow: 0 -12px 40px rgba(0,0,0,.4);
  transition: transform .25s ease;
}

/* PANEL TOGGLE */

.panel-toggle {
  position: absolute;
  left: 50%;
  top: -32px;
  transform: translateX(-50%);
  width: 58px;
  height: 30px;
  border: 1px solid #263244;
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  background: #0c111a;
  color: #94a3b8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  z-index: 2001;
}

.bottom-panel.collapsed {
  transform: translateY(100%);
}

.bottom-panel.collapsed .panel-toggle {
  top: -42px;
  border-bottom: 1px solid #263244;
  border-radius: 10px;
}

.tabs {
  height: 48px;
  display: flex;
  overflow-x: auto;
  border-bottom: 1px solid #202838;
}

.tab {
  min-width: 90px;
  flex: 1;
  border: 0;
  color: #94a3b8;
  background: transparent;
  font-size: 12px;
}

.tab.active {
  color: white;
  background: #162033;
}

.panel-content {
  height: 160px;
  overflow-y: auto;
  padding: 9px;
}

/* SCREEN LIST */

.screen-list {
  display: flex;
  gap: 7px;
  overflow-x: auto;
}

.screen-item {
  min-width: 100px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #273449;
  background: #121a27;
  color: white;
  text-align: left;
  font-size: 12px;
}

.screen-item.active {
  border-color: #3b82f6;
  background: #172554;
}

.add-screen {
  min-width: 100px;
  border: 1px dashed #475569;
  background: transparent;
  color: #93c5fd;
  border-radius: 10px;
}

/* FORMS */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  color: #94a3b8;
  font-size: 10px;
}

.field input,
.field select {
  width: 100%;
  min-height: 34px;
  border: 1px solid #293548;
  background: #111827;
  color: white;
  border-radius: 8px;
  padding: 7px 8px;
  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: #3b82f6;
}

textarea {
  resize: none;
}

/* BUTTONS */

.action-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.action-btn {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 9px;
  background: #1e293b;
  color: white;
  font-size: 11px;
}

.action-btn.primary {
  background: #2563eb;
}

.action-btn.danger {
  background: #7f1d1d;
}

.secondary-btn,
.danger-btn {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 10px;
  color: white;
  font-weight: 600;
  font-size: 11px;
}

.secondary-btn {
  background: #263244;
}

.danger-btn {
  background: #7f1d1d;
}

/* IMAGE */

.image-preview {
  margin-top: 6px;
  width: 100%;
  height: 70px;
  border-radius: 9px;
  background: #080d15;
  border: 1px solid #263244;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* ELEMENT LIST */

.element-list {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 3px;
  flex-wrap: wrap;
}

.element-item {
  min-width: 105px;
  padding: 8px;
  border-radius: 9px;
  border: 1px solid #273449;
  background: #121a27;
  color: #cbd5e1;
  font-size: 11px;
}

.element-item.active {
  border-color: #3b82f6;
  color: white;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  z-index: 5000;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(360px, 100%);
  background: #111827;
  border: 1px solid #293548;
  border-radius: 16px;
  padding: 15px;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
}

/* EVENTS */

.event-box {
  background: #101722;
  border: 1px solid #263244;
  border-radius: 10px;
  padding: 8px;
  margin-bottom: 7px;
}

.event-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}

.event-title {
  font-size: 11px;
  font-weight: 700;
}

.action-box {
  border: 1px solid #253247;
  background: #0b111b;
  padding: 7px;
  border-radius: 8px;
  margin-top: 6px;
}

.action-box-title {
  font-size: 10px;
  color: #64748b;
  margin-bottom: 5px;
}

/* TOAST */

.toast {
  position: fixed;
  left: 50%;
  bottom: 225px;
  transform: translateX(-50%) translateY(15px);
  z-index: 9000;
  background: #e5e7eb;
  color: #111827;
  padding: 9px 13px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
}

.notif-icon {

/* CONTROL CENTER */

.control-center {

/* SCREEN TRANSITION ANIMATIONS (6 ÇEŞİT) */

@keyframes animSlide {
  0% { opacity: 0.2; transform: translateX(30px); }
  100% { opacity: 1; transform: translateX(0); }
}
.screen-changing.anim-slide { animation: animSlide .22s ease; }

@keyframes animFade {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
.screen-changing.anim-fade { animation: animFade .25s ease; }

@keyframes animZoom {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.screen-changing.anim-zoom { animation: animZoom .22s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

@keyframes animSlideUp {
  0% { opacity: 0.2; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes animFlip {

  100% { opacity: 1; transform: rotateY(0deg); }
}
.screen-changing.anim-flip { animation: animFlip .28s ease; transform-style: preserve-3d; }

@keyframes animBounce {
  0% { opacity: 0; transform: scale(0.6); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}
.screen-changing.anim-bounce { animation: animBounce .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

<script>

/* =========================================================

let project = {

          events: [
            {

              actions: [
                {
                  type: "setText",
                  target: "title_01",

                }
              ]
            }
          ]
        }

      ]
    },

    {
      id: "Settings",
      name: "Settings",

      background: "#0f172a",
      transition: "fade",

      elements: [

        {
          id: "settings_title",
          type: "text",

          x: 20,
          y: 70,
          w: 300,
          h: 45,

          text: "Ayarlar",

          color: "#ffffff",
          fontSize: 25,

          events: []
        },

        {
          id: "back_button",
          type: "button",

          x: 20,
          y: 140,
          w: 150,
          h: 50,

          text: "Geri",

          color: "#ffffff",
          background: "#475569",

          fontSize: 14,
          radius: 12,

          image: "",
          imagePosition: "left",
          imageSize: 24,

          events: [
            {
              trigger: "click",

              actions: [
                {
                  type: "navigate",
                  screen: "Home"
                }
              ]
            }
          ]
        }

      ]
    }
  ]
};


/* =========================================================
   STATE
========================================================= */

let selectedElement = null;

let previewMode = false;

let history = [];

let historyIndex = -1;

let clipboard = null;


/* =========================================================
   TIMERS & SPINNER STATE
========================================================= */

const spinnerTimers = {};

const activeClockIntervals = {};


/* =========================================================
   PANEL STATE
========================================================= */

let bottomPanelOpen = true;


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

  loadProject();

  pushHistory();

  render();

  updateTime();

  setInterval(updateTime, 30000);

});


/* =========================================================
   BOTTOM PANEL TOGGLE
========================================================= */

function toggleBottomPanel() {

  const panel =
    document.getElementById(
      "bottomPanel"
    );

  const toggle =
    document.getElementById(
      "panelToggle"
    );


  bottomPanelOpen =
    !bottomPanelOpen;


  panel.classList.toggle(
    "collapsed",
    !bottomPanelOpen
  );


  toggle.textContent =
    bottomPanelOpen
      ? "▼"
      : "▲";

}


/* =========================================================
   CURRENT SCREEN
========================================================= */

function getCurrentScreen() {

  return project.screens.find(
    screen => screen.id === project.currentScreen
  );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  renderCanvas();

  renderPanel();

}


/* =========================================================
   CANVAS
========================================================= */

function renderCanvas() {

  const screen = getCurrentScreen();

  const canvas = document.getElementById("canvas");

  const phoneScreen =
    document.getElementById("phoneScreen");

  canvas.innerHTML = "";

  phoneScreen.style.background =
    screen.background || "#111827";

  if (screen.backgroundImage) {
    phoneScreen.style.backgroundImage = `url(${screen.backgroundImage})`;
    phoneScreen.style.backgroundSize = "cover";
    phoneScreen.style.backgroundPosition = "center";
  } else {
    phoneScreen.style.backgroundImage = "none";
  }


  screen.elements.forEach(element => {

    const node =
      createElementNode(element);

    canvas.appendChild(node);

  });

}


/* =========================================================
   LIQUID GLASS HELPERS
========================================================= */

function hexToRgba(
  hex,
  alpha
) {

  hex =
    String(hex || "#ffffff")
      .replace("#", "");

  if (hex.length === 3) {

    hex =
      hex
        .split("")
        .map(value => value + value)
        .join("");

  }

  const number =
    parseInt(hex, 16);

  const r =
    (number >> 16) & 255;

  const g =
    (number >> 8) & 255;

  const b =
    number & 255;

  return `
    rgba(
      ${r},
      ${g},
      ${b},
      ${Math.max(
        0,
        Math.min(
          100,
          Number(alpha ?? 18)
        )
      ) / 100}
    )
  `;

}


function applyLiquidGlassStyles(
  node,
  element
) {

  node.style.background =
    hexToRgba(
      element.glassColor || "#ffffff",
      element.glassOpacity ?? 18
    );

  node.style.color =
    element.color || "#ffffff";

  node.style.fontSize =
    (element.fontSize || 14) + "px";

  node.style.borderRadius =
    (element.radius ?? 18) + "px";

  node.style.border =
    `${element.borderWidth ?? 1}px solid ${
      hexToRgba(
        element.borderColor || "#ffffff",
        element.borderOpacity ?? 22
      )
    }`;

  node.style.backdropFilter =
    `blur(${element.blur ?? 18}px) saturate(${element.saturation ?? 150}%)`;

  node.style.webkitBackdropFilter =
    `blur(${element.blur ?? 18}px) saturate(${element.saturation ?? 150}%)`;

  const shadow =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          element.shadow ?? 18
        )
      )
    );

  node.style.boxShadow =
    `
      inset 0 1px 0 rgba(255,255,255,.22),
      0 ${Math.round(shadow / 2)}px ${Math.round(
        12 + shadow
      )}px rgba(0,0,0,${shadow / 100})
    `;

}


/* =========================================================
   SPINNER TIMER
========================================================= */

function startSpinnerTimer(element) {

  if (
    !previewMode ||
    element.type !== "spinner"
  ) {

    return;

  }


  const seconds =
    Number(
      element.autoHideSeconds ?? 0
    );


  if (
    !seconds ||
    seconds <= 0
  ) {

    return;

  }


  clearTimeout(
    spinnerTimers[element.id]
  );


  spinnerTimers[element.id] =
    setTimeout(
      () => {

        element.hidden =
          true;

        delete spinnerTimers[element.id];

        renderCanvas();

        runEvent(
          element,
          "timerEnd"
        );

      },
      seconds * 1000
    );

}


/* =========================================================
   CREATE ELEMENT NODE
========================================================= */

function formatTimeDisplay(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}


function startTimerClock(element, displayNode) {
  clearInterval(activeClockIntervals[element.id]);
  
  if (!previewMode) return;

  let currentSec = Number(element.timerSeconds ?? 60);
  const mode = element.timerMode || "down";

  activeClockIntervals[element.id] = setInterval(() => {
    if (mode === "down") {
      currentSec--;
      if (currentSec <= 0) {
        currentSec = 0;
        clearInterval(activeClockIntervals[element.id]);
        displayNode.textContent = formatTimeDisplay(0);
        runEvent(element, "timeUp");
        return;
      }
    } else {
      currentSec++;
      const target = Number(element.targetSeconds ?? 60);
      if (target > 0 && currentSec >= target) {
        currentSec = target;
        clearInterval(activeClockIntervals[element.id]);
        displayNode.textContent = formatTimeDisplay(currentSec);
        runEvent(element, "timeUp");
        return;
      }
    }
    displayNode.textContent = formatTimeDisplay(currentSec);
  }, 1000);
}


function checkPinComplete(element) {
  const len = Number(element.pinLength ?? 4);
  if ((element.text || "").length === len) {
    if (element.text === (element.value || "1234")) {
      runEvent(element, "correctPin");
    } else {
      runEvent(element, "wrongPin");
      setTimeout(() => {
        element.text = "";
        renderCanvas();
      }, 400);
    }
  }
}


function createElementNode(element) {

  const node =
    document.createElement("div");

  node.className =
    "canvas-element";

  node.dataset.id =
    element.id;

  node.style.left =
    element.x + "px";

  node.style.top =
    element.y + "px";

  node.style.width =
    element.w + "px";

  node.style.height =
    element.h + "px";


  if (
    selectedElement &&
    selectedElement.id === element.id &&
    !previewMode
  ) {

    node.classList.add(
      "editor-selected"
    );

  }


  /* TEXT */

  if (element.type === "text") {

    node.classList.add("el-text");

    node.textContent =
      element.text || "";

    node.style.color =
      element.color || "#ffffff";

    node.style.fontSize =
      (element.fontSize || 16) + "px";

  }


  /* HEADING */

  else if (element.type === "heading") {

    node.classList.add("el-heading");

    node.textContent =
      element.text || "Başlık";

    node.style.color =
      element.color || "#ffffff";

    node.style.fontSize =
      (element.fontSize || 24) + "px";

  }


  /* LABEL */

  else if (element.type === "label") {

    node.classList.add("el-label");

    node.textContent =
      element.text || "Etiket";

    node.style.color =
      element.color || "#cbd5e1";

    node.style.fontSize =
      (element.fontSize || 12) + "px";

  }


  /* BUTTON */

  else if (element.type === "button") {

    node.classList.add("el-button");

    node.style.background =
      element.background || "#2563eb";

    node.style.color =
      element.color || "#ffffff";

    node.style.fontSize =
      (element.fontSize || 14) + "px";

    node.style.borderRadius =
      (element.radius || 10) + "px";


    const image =
      element.image || "";

    const text =
      element.text || "";


    if (image) {

      const img =
        document.createElement("img");

      img.src = image;

      img.draggable = false;

      img.style.width =
        (element.imageSize || 24) + "px";

      img.style.height =
        (element.imageSize || 24) + "px";


      if (
        element.imagePosition === "top"
      ) {

        node.classList.add(
          "image-top"
        );

        node.appendChild(img);

        const span =
          document.createElement("span");

        span.textContent = text;

        node.appendChild(span);

      }

      else if (
        element.imagePosition === "right"
      ) {

        node.style.flexDirection =
          "row-reverse";

        node.appendChild(img);

        const span =
          document.createElement("span");

        span.textContent = text;

        node.appendChild(span);

      }

      else if (
        element.imagePosition === "only"
      ) {

        node.classList.add(
          "image-only"
        );

        node.appendChild(img);

      }

      else {

        node.appendChild(img);

        const span =
          document.createElement("span");

        span.textContent = text;

        node.appendChild(span);

      }

    }

    else {

      node.textContent =
        text;

    }

  }


  /* INPUT */

  else if (element.type === "input") {

    const input =
      document.createElement("input");

    input.className =
      "el-input";

    input.placeholder =
      element.placeholder || "Metin gir...";

    node.appendChild(input);

  }


  /* PIN ELEMENTİ */

  else if (element.type === "pin") {

    node.classList.add("el-pin");

    const dotsWrap = document.createElement("div");
    dotsWrap.className = "pin-dots";
    const len = Number(element.pinLength ?? 4);
    const currentText = element.text || "";

    for (let i = 0; i < len; i++) {
      const dot = document.createElement("div");
      dot.className = "pin-dot" + (i < currentText.length ? " filled" : "");
      dotsWrap.appendChild(dot);
    }
    node.appendChild(dotsWrap);

    if (previewMode) {
      const keypad = document.createElement("div");
      keypad.className = "pin-keypad";

      for (let n = 1; n <= 9; n++) {
        const kBtn = document.createElement("button");
        kBtn.className = "pin-key-btn";
        kBtn.textContent = n;
        kBtn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if ((element.text || "").length < len) {
            element.text = (element.text || "") + n;
            renderCanvas();
            checkPinComplete(element);
          }
        });
        keypad.appendChild(kBtn);
      }

      const zeroBtn = document.createElement("button");
      zeroBtn.className = "pin-key-btn";
      zeroBtn.textContent = "0";
      zeroBtn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if ((element.text || "").length < len) {
          element.text = (element.text || "") + "0";
          renderCanvas();
          checkPinComplete(element);
        }
      });
      keypad.appendChild(zeroBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "pin-key-btn";
      delBtn.textContent = "⌫";
      delBtn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        element.text = (element.text || "").slice(0, -1);
        renderCanvas();
      });
      keypad.appendChild(delBtn);

      node.appendChild(keypad);
    } else {
      const info = document.createElement("div");
      info.style.fontSize = "10px";
      info.style.color = "#94a3b8";
      info.textContent = `PIN Keypad (${len} Hane)`;
      node.appendChild(info);
    }

  }


  /* ZAMAN SAYACI (TIMER ELEMENTI) */

  else if (element.type === "timer") {

    node.classList.add("el-timer");

    const initialSec = Number(element.timerSeconds ?? 60);
    node.textContent = formatTimeDisplay(initialSec);

    startTimerClock(element, node);

  }


  /* OS DIALOG & ALERT BOX ELEMENTI */

  else if (element.type === "osDialog") {

    node.classList.add("el-os-dialog");

    const header = document.createElement("div");
    header.className = "el-os-dialog-header";
    header.textContent = element.dialogTitle || "Sistem Uyarısı";

    const body = document.createElement("div");
    body.className = "el-os-dialog-body";
    body.textContent = element.dialogMessage || "Bu işlemi gerçekleştirmek istiyor musunuz?";

    const actions = document.createElement("div");
    actions.className = "el-os-dialog-actions";

    const btnCancel = document.createElement("button");
    btnCancel.className = "el-os-dialog-btn cancel";
    btnCancel.textContent = element.btnCancelText || "İptal";

    const btnConfirm = document.createElement("button");
    btnConfirm.className = "el-os-dialog-btn confirm";
    btnConfirm.textContent = element.btnConfirmText || "Tamam";

    if (previewMode) {
      btnCancel.addEventListener("click", event => {
        event.stopPropagation();
        runEvent(element, "dialogCancel");
      });

      btnConfirm.addEventListener("click", event => {
        event.stopPropagation();
        runEvent(element, "dialogConfirm");
      });
    }

    actions.appendChild(btnCancel);
    actions.appendChild(btnConfirm);

    node.appendChild(header);
    node.appendChild(body);
    node.appendChild(actions);

  }


  /* TEXTAREA */

  else if (element.type === "textarea") {

    const textarea =
      document.createElement("textarea");

    textarea.className =
      "el-textarea";

    textarea.placeholder =
      element.placeholder || "Metin gir...";

    textarea.value =
      element.text || "";

    node.appendChild(textarea);

  }


  /* CHECKBOX */

  else if (element.type === "checkbox") {

    const label =
      document.createElement("label");

    label.className =
      "el-checkbox";

    const input =
      document.createElement("input");

    input.type =
      "checkbox";

    input.checked =
      !!element.checked;

    const span =
      document.createElement("span");

    span.textContent =
      element.text || "Checkbox";

    label.appendChild(input);

    label.appendChild(span);

    node.appendChild(label);

  }


  /* SWITCH */

  else if (element.type === "switch") {

    const switchNode =
      document.createElement("div");

    switchNode.className =
      "el-switch";

    if (element.checked) {

      switchNode.classList.add("on");

    }

    const track =
      document.createElement("div");

    track.className =
      "el-switch-track";

    const thumb =
      document.createElement("div");

    thumb.className =
      "el-switch-thumb";

    track.appendChild(thumb);

    switchNode.appendChild(track);

    node.appendChild(switchNode);

  }


  /* RADIO */

  else if (element.type === "radio") {

    const label =
      document.createElement("label");

    label.className =
      "el-radio";

    const input =
      document.createElement("input");

    input.type =
      "radio";

    input.name =
      element.group || "radio";

    input.checked =
      !!element.checked;

    const span =
      document.createElement("span");

    span.textContent =
      element.text || "Radio";

    label.appendChild(input);

    label.appendChild(span);

    node.appendChild(label);

  }


  /* LIQUID GLASS SLIDER */

  else if (element.type === "slider") {

    const wrap = document.createElement("div");
    wrap.className = "el-liquid-slider-wrap";

    const topBar = document.createElement("div");
    topBar.className = "el-liquid-slider-top";

    const labelSpan = document.createElement("span");
    labelSpan.textContent = element.text || "Slider";

    const valSpan = document.createElement("span");
    valSpan.textContent = element.value ?? 50;

    topBar.appendChild(labelSpan);
    topBar.appendChild(valSpan);
    wrap.appendChild(topBar);

    const input = document.createElement("input");
    input.type = "range";
    input.className = "el-slider";
    input.min = element.min ?? 0;
    input.max = element.max ?? 100;
    input.value = element.value ?? 50;

    if (previewMode) {
      input.addEventListener("input", (ev) => {
        ev.stopPropagation();
        element.value = Number(ev.target.value);
        valSpan.textContent = element.value;
        runEvent(element, "valueMatch", String(element.value));
      });
    } else {
      input.style.pointerEvents = "none";
    }

    wrap.appendChild(input);
    node.appendChild(wrap);

  }


  /* CARD */

  else if (element.type === "card") {

    node.classList.add("el-card");

    node.style.background =
      element.background || "#1a2230";

  }


  /* IMAGE */

  else if (element.type === "image") {

    const img =
      document.createElement("img");

    img.className =
      "el-image";

    img.src =
      element.image || "";

    img.draggable = false;

    node.appendChild(img);

  }


  /* PROGRESS */

  else if (element.type === "progress") {

    const wrap =
      document.createElement("div");

    wrap.className =
      "el-progress-wrap";

    const progress =
      document.createElement("div");

    progress.className =
      "el-progress";

    const bar =
      document.createElement("div");

    bar.className =
      "el-progress-bar";

    bar.style.width =
      (element.value || 50) + "%";

    progress.appendChild(bar);

    wrap.appendChild(progress);

    node.appendChild(wrap);

  }


  /* BADGE */

  else if (element.type === "badge") {

    node.classList.add("el-badge");

    node.textContent =
      element.text || "Badge";

    node.style.background =
      element.background || "#2563eb";

  }


  /* DIVIDER */

  else if (element.type === "divider") {

    node.classList.add("el-divider");

    const line =
      document.createElement("div");

    line.className =
      "el-divider-line";

    node.appendChild(line);

  }


  /* AVATAR */

  else if (element.type === "avatar") {

    node.classList.add("el-avatar");

    if (element.image) {

      const img =
        document.createElement("img");

      img.src =
        element.image;

      node.appendChild(img);

    }

    else {

      node.textContent =
        element.text || "A";

    }

  }


  /* SPINNER */

  else if (element.type === "spinner") {

    node.classList.add("el-spinner");

    const spinner =
      document.createElement("div");

    spinner.className =
      "el-spinner-circle";

    node.appendChild(spinner);


    startSpinnerTimer(
      element
    );

  }


  /* LIST */

  else if (element.type === "list") {

    node.classList.add("el-list");

    const items =
      element.items ||
      [
        "Liste öğesi 1",
        "Liste öğesi 2",
        "Liste öğesi 3"
      ];

    items.forEach(item => {

      const row =
        document.createElement("div");

      row.className =
        "el-list-item";

      row.textContent =
        item;

      node.appendChild(row);

    });

  }


  /* SCROLLVIEW */

  else if (element.type === "scrollview") {

    node.classList.add("el-scrollview");

    node.textContent =
      element.text ||
      "ScrollView içeriği";

  }


  /* MODAL */

  else if (element.type === "modal") {

    node.classList.add("el-modal");

    const box =
      document.createElement("div");

    box.className =
      "el-modal-box";

    box.textContent =
      element.text ||
      "Modal";

    node.appendChild(box);

  }


  /* DROPDOWN */

  else if (element.type === "dropdown") {

    const select =
      document.createElement("select");

    select.className =
      "el-dropdown";

    const items =
      element.items ||
      [
        "Seçenek 1",
        "Seçenek 2",
        "Seçenek 3"
      ];

    items.forEach(item => {

      const option =
        document.createElement("option");

      option.textContent =
        item;

      option.value =
        item;

      select.appendChild(option);

    });

    node.appendChild(select);

  }


  /* VIDEO */

  else if (element.type === "video") {

    const video =
      document.createElement("video");

    video.className =
      "el-video";

    video.src =
      element.source || "";

    video.controls =
      true;

    node.appendChild(video);

  }


  /* AUDIO */

  else if (element.type === "audio") {

    const audio =
      document.createElement("audio");

    audio.className =
      "el-audio";

    audio.src =
      element.source || "";

    audio.controls =
      true;

    node.appendChild(audio);

  }


  /* NAV */

  else if (element.type === "nav") {

    node.classList.add("el-nav");

    node.innerHTML =
      "⌂ &nbsp;&nbsp;&nbsp; Apps &nbsp;&nbsp;&nbsp; ⚙";

  }


  /* SIDEBAR */

  else if (element.type === "sidebar") {

    node.classList.add("el-sidebar");

    node.textContent =
      element.text ||
      "☰\n\nAna Sayfa\n\nUygulamalar\n\nAyarlar";

    node.style.whiteSpace =
      "pre-line";

  }


  /* TABBAR */

  else if (element.type === "tabbar") {

    node.classList.add("el-tabbar");

    node.innerHTML =
      "⌂ Ana Sayfa &nbsp;&nbsp; ◉ Uygulamalar &nbsp;&nbsp; ⚙ Ayarlar";

  }


  /* TERMINAL */

  else if (element.type === "terminal") {

    node.classList.add("el-terminal");

    const output = document.createElement("div");
    output.className = "terminal-output";
    output.textContent = element.text || "$ devos\n$ ready...";
    node.appendChild(output);

    if (previewMode) {
      const inputWrap = document.createElement("div");
      inputWrap.className = "terminal-input-wrap";

      const prompt = document.createElement("span");
      prompt.className = "terminal-prompt";
      prompt.textContent = ">";
      inputWrap.appendChild(prompt);

      const input = document.createElement("input");
      input.className = "terminal-input";
      input.type = "text";
      input.placeholder = "Komut yazın...";

      input.addEventListener("keydown", (ev) => {
        ev.stopPropagation();
        if (ev.key === "Enter") {
          const cmd = input.value.trim();
          output.textContent += `\n> ${cmd}`;
          input.value = "";
          output.scrollTop = output.scrollHeight;

          runEvent(element, "commandMatch", cmd);
        }
      });

      inputWrap.appendChild(input);
      node.appendChild(inputWrap);
    }

  }


  /* =======================================================
     LIQUID GLASS PANEL
  ======================================================= */

  else if (
    element.type === "liquidGlass"
  ) {

    node.classList.add(
      "el-liquid-glass"
    );

    node.textContent =
      element.text ||
      "Liquid Glass";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* =======================================================
     LIQUID GLASS BUTTON
  ======================================================= */

  else if (
    element.type === "liquidGlassButton"
  ) {

    node.classList.add(
      "el-liquid-glass-button"
    );

    node.textContent =
      element.text ||
      "Glass Button";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* =======================================================
     LIQUID GLASS CARD
  ======================================================= */

  else if (
    element.type === "liquidGlassCard"
  ) {

    node.classList.add(
      "el-liquid-glass-card"
    );

    node.textContent =
      element.text ||
      "Glass Card";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* =======================================================
     LIQUID GLASS NAV
  ======================================================= */

  else if (
    element.type === "liquidGlassNav"
  ) {

    node.classList.add(
      "el-liquid-glass-nav"
    );

    node.textContent =
      element.text ||
      "⌂  Ana Sayfa    Apps    ⚙ Ayarlar";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* =======================================================
     LIQUID GLASS TABBAR
  ======================================================= */

  else if (
    element.type === "liquidGlassTabbar"
  ) {

    node.classList.add(
      "el-liquid-glass-tabbar"
    );

    node.textContent =
      element.text ||
      "⌂ Ana Sayfa    ◉ Uygulamalar    ⚙ Ayarlar";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* =======================================================
     LIQUID GLASS MODAL
  ======================================================= */

  else if (
    element.type === "liquidGlassModal"
  ) {

    node.classList.add(
      "el-liquid-glass-modal"
    );

    node.textContent =
      element.text ||
      "Glass Modal";

    applyLiquidGlassStyles(
      node,
      element
    );

  }


  /* EVENTS & LONG PRESS LOGIC */

  if (previewMode) {

    let longPressTimer = null;
    let isLongPressTriggered = false;

    const startPress = (event) => {
      isLongPressTriggered = false;
      clearTimeout(longPressTimer);

      longPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        runEvent(element, "longpress");
      }, 500);
    };

    const cancelPress = () => {
      clearTimeout(longPressTimer);
    };

    node.addEventListener("mousedown", startPress);
    node.addEventListener("mouseup", cancelPress);
    node.addEventListener("mouseleave", cancelPress);
    node.addEventListener("touchstart", startPress, { passive: true });
    node.addEventListener("touchend", cancelPress);
    node.addEventListener("touchcancel", cancelPress);

    node.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        if (isLongPressTriggered) {
          isLongPressTriggered = false;
          return;
        }

        if (
          element.type === "switch"
        ) {

          element.checked =
            !element.checked;

          renderCanvas();

          runEvent(
            element,
            element.checked
              ? "switchOn"
              : "switchOff"
          );

          return;

        }


        runEvent(
          element,
          "click"
        );

      }
    );


    node.addEventListener(
      "dblclick",
      event => {

        event.stopPropagation();

        runEvent(
          element,
          "doubleclick"
        );

      }
    );

  }

  else {

    node.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        selectElement(
          element.id
        );

      }
    );

  }


  return node;

}


/* =========================================================
   SELECT
========================================================= */

function selectElement(id) {

  const screen =
    getCurrentScreen();

  selectedElement =
    screen.elements.find(
      element => element.id === id
    );

  openTab("edit");

  render();

}


/* =========================================================
   PANEL
========================================================= */

let activeTab = "screens";


function openTab(tab) {

  activeTab = tab;

  document
    .querySelectorAll(".tab")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );

    });

  renderPanel();

}


/* =========================================================
   RENDER PANEL
========================================================= */

function renderPanel() {

  const panel =
    document.getElementById(
      "panelContent"
    );

  if (activeTab === "screens") {

    panel.innerHTML =
      renderScreensPanel();

  }

  else if (activeTab === "add") {

    panel.innerHTML =
      renderAddPanel();

  }

  else if (activeTab === "edit") {

    panel.innerHTML =
      renderEditPanel();

  }

  else if (activeTab === "events") {

    panel.innerHTML =
      renderEventsPanel();

  }

}


/* =========================================================
   SCREENS PANEL
========================================================= */

function renderScreensPanel() {

  let html = `
    <div class="screen-list">
  `;


  project.screens.forEach(screen => {

    html += `
      <button
        class="screen-item ${
          screen.id === project.currentScreen
            ? "active"
            : ""
        }"
        onclick="switchScreen('${escapeAttr(screen.id)}')"
      >
        📱 ${escapeHtml(screen.name)}
      </button>
    `;

  });


  html += `
      <button
        class="screen-item add-screen"
        onclick="openScreenModal()"
      >
        ＋ Yeni
      </button>
    </div>
  `;


  return html;

}

function renderEditPanel() {

  if (!selectedElement) {
    const screen = getCurrentScreen();
    return `
      <div class="form-grid">
        <div class="field full">
          <label>Arka Plan Rengi</label>
          <input
            type="color"
            value="${screen.background || "#111827"}"
            onchange="updateScreenBgColor(this.value)"
          >
        </div>
        <div class="field full">
          <label>Geçiş Animasyonu (Transition)</label>
          <select onchange="updateScreenTransition(this.value)">
            <option value="slide" ${screen.transition === "slide" || !screen.transition ? "selected" : ""}>Sağdan Kayma (Slide)</option>
            <option value="fade" ${screen.transition === "fade" ? "selected" : ""}>Solarak Geçiş (Fade)</option>
            <option value="zoom" ${screen.transition === "zoom" ? "selected" : ""}>Yakınlaşarak Açılma (Zoom)</option>
            <option value="slide-up" ${screen.transition === "slide-up" ? "selected" : ""}>Aşağıdan Kayma (Slide Up)</option>

========================================================= */

function renderEventsPanel() {

  if (!selectedElement) {

    return `
      <div class="empty">
        Önce bir element seç.
      </div>
    `;

  }


  const e =
    selectedElement;


  if (!e.events) {

    e.events = [];

  }


  let html = `

    <div class="action-row">

      <button
        class="action-btn primary"
        onclick="addEvent()"
      >
        ＋ Event ekle
      </button>

    </div>

  `;


  if (e.events.length === 0) {

    html += `
      <div class="empty">
        Bu elementte event yok.
      </div>
    `;

    return html;

  }


  e.events.forEach(
    (event, eventIndex) => {

      html += `

        <div class="event-box">

          <div class="event-header">

            <div class="event-title">
              Event #${eventIndex + 1}
            </div>

            <button
              class="action-btn danger"
              onclick="removeEvent(${eventIndex})"
            >
              Sil
            </button>

          </div>

          <div class="field">

            <label>Tetikleyici</label>

            <select
              onchange="
                updateEventTrigger(
                  ${eventIndex},
                  this.value
                )
              "
            >

              <option
                value="click"
                ${
                  event.trigger === "click"
                    ? "selected"
                    : ""
                }
              >
                Click (Tıklama)
              </option>

              <option
                value="doubleclick"
                ${
                  event.trigger === "doubleclick"
                    ? "selected"
                    : ""
                }
              >
                Double Click (Çift Tıklama)
              </option>

              <option
                value="longpress"
                ${
                  event.trigger === "longpress"
                    ? "selected"
                    : ""
                }
              >
                Long Press (Basılı Tutma)
              </option>

              ${
                e.type === "slider"
                  ? `
                    <option
                      value="valueMatch"
                      ${
                        event.trigger === "valueMatch"
                          ? "selected"
                          : ""
                      }
                    >
                      Sayı Değerine Ulaşıldığında
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "switch"
                  ? `
                    <option
                      value="switchOn"
                      ${
                        event.trigger === "switchOn"
                          ? "selected"
                          : ""
                      }
                    >
                      Switch Açıldı
                    </option>

                    <option
                      value="switchOff"
                      ${
                        event.trigger === "switchOff"
                          ? "selected"
                          : ""
                      }
                    >
                      Switch Kapatıldı
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "spinner"
                  ? `
                    <option
                      value="timerEnd"
                      ${
                        event.trigger === "timerEnd"
                          ? "selected"
                          : ""
                      }
                    >
                      Zamanlayıcı Bittiğinde
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "pin"
                  ? `
                    <option
                      value="correctPin"
                      ${
                        event.trigger === "correctPin"
                          ? "selected"
                          : ""
                      }
                    >
                      Doğru PIN Girildiğinde
                    </option>

                    <option
                      value="wrongPin"
                      ${
                        event.trigger === "wrongPin"
                          ? "selected"
                          : ""
                      }
                    >
                      Yanlış PIN Girildiğinde
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "terminal"
                  ? `
                    <option
                      value="commandMatch"
                      ${
                        event.trigger === "commandMatch"
                          ? "selected"
                          : ""
                      }
                    >
                      Komut Eşleştiğinde (Command Match)
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "timer"
                  ? `
                    <option
                      value="timeUp"
                      ${
                        event.trigger === "timeUp"
                          ? "selected"
                          : ""
                      }
                    >
                      Süre Dolduğunda / Hedefe Ulaşıldığında
                    </option>
                  `
                  : ""
              }

              ${
                e.type === "osDialog"
                  ? `
                    <option
                      value="dialogConfirm"
                      ${
                        event.trigger === "dialogConfirm"
                          ? "selected"
                          : ""
                      }
                    >
                      Onay (Sağ Buton) Tıklandığında
                    </option>

                    <option
                      value="dialogCancel"
                      ${
                        event.trigger === "dialogCancel"
                          ? "selected"
                          : ""
                      }
                    >
                      İptal (Sol Buton) Tıklandığında
                    </option>
                  `
                  : ""
              }

            </select>

          </div>

      `;


      if (event.trigger === "commandMatch" || event.trigger === "valueMatch") {
        html += `
          <div class="field">
            <label>${event.trigger === "valueMatch" ? "Tetiklenecek Sayısal Değer" : "Eşleşecek Komut / Metin"}</label>
            <input
              type="${event.trigger === "valueMatch" ? "number" : "text"}"

      }

      event.actions.forEach(

                    }

                  <option
                    value="show"

                      action.type === "show"
                        ? "selected"
                        : ""
                    }
                  >

                  <option
                    value="hide"

                      action.type === "hide"

                        : ""
                    }

                    Gizle
                  </option>

                  <option

                      action.type === "toggleSwitch"
                        ? "selected"
                        : ""

                      ${eventIndex},
                      ${actionIndex},
                      'screen',
                      this.value
                    )

                  ${getScreenOptions(
                    action.screen
                  )}

                </select>

              </div>

            `;

          }


          if (
            action.type === "show" ||
            action.type === "hide" ||
            action.type === "toggleSwitch"
          ) {

            html += `

              <div class="field">

                <label>Hedef</label>

                <select
                  onchange="
                    updateActionValue(
                      ${eventIndex},
                      ${actionIndex},
                      'target',

                  )}

          if (

          ) {

          ) {

            html += `

                  onchange="
                    updateActionValue(
                      ${eventIndex},
                      ${actionIndex},
                      'target',
                      this.value
                    )

                >

                    action.target
                  )}

                </select>

              </div>

              <div class="field">

                <label>Yeni Renk</label>

                <input
                  type="color"
                  value="${action.value || "#16a34a"}"
                  onchange="
                    updateActionValue(
                      ${eventIndex},
                      ${actionIndex},
                      'value',
                      this.value
                    )
                  "
                />

              </div>

            `;

          }


          if (
            action.type === "notificationBanner"
          ) {

            html += `

              <div class="field">

                <label>Bildirim Başlığı</label>

                <input
                  value="${escapeAttr(action.title || "DevOS")}"
                  onchange="
                    updateActionValue(
                      ${eventIndex},
                      ${actionIndex},

                      this.value
                    )
                  "
                >

              <div class="field">

                <label>Bildirim Mesajı</label>

                <input
                  value="${escapeAttr(action.value || "Yeni bildirim")}"
                  onchange="
                    updateActionValue(
                      ${eventIndex},
                      ${actionIndex},
                      'value',
                      this.value
                    )
                  "
                >

          }


          html += `

              <button
                class="action-btn danger"
                onclick="
                  removeAction(
                    ${eventIndex},
                    ${actionIndex}
                  )
                "
              >
                Action sil
              </button>

            </div>
          `;

        }
      );


      html += `

          <button
            class="action-btn primary"
            onclick="addAction(${eventIndex})"
          >
            ＋ Action ekle
          </button>

        </div>

      `;

    }
  );


  return html;

}


/* =========================================================
   ELEMENT OPTIONS
========================================================= */

function getElementOptions(
  selected,
  switchesOnly = false
) {

  const screen =
    getCurrentScreen();


  return screen.elements
    .filter(
      element => {

        if (switchesOnly) {

          return element.type === "switch";

        }


        return (
          element.type === "text" ||
          element.type === "button" ||
          element.type === "heading" ||
          element.type === "label" ||
          element.type === "badge" ||
          element.type === "slider" ||
          element.type === "osDialog"
        );

      }
    )
    .map(
      element => `
        <option
          value="${escapeAttr(element.id)}"
          ${
            element.id === selected
              ? "selected"
              : ""
          }
        >
          ${escapeHtml(
            element.text ||
            (
              element.type === "switch"
                ? "Switch"
                : element.type === "slider"
                  ? "Slider"
                  : element.type === "osDialog"
                    ? (element.dialogTitle || "OS Dialog")
                    : element.id
            )
          )}
        </option>
      `
    )
    .join("");

}


function getTerminalOptions(selected) {
  const screen = getCurrentScreen();

  return screen.elements
    .filter(element => element.type === "terminal")
    .map(
      element => `
        <option
          value="${escapeAttr(element.id)}"
          ${element.id === selected ? "selected" : ""}
        >
          Terminal (${escapeHtml(element.id)})
        </option>
      `
    )
    .join("");
}


/* =========================================================
   SCREEN OPTIONS
========================================================= */

function getScreenOptions(
  selected
) {

  return project.screens
    .map(
      screen => `
        <option
          value="${escapeAttr(screen.id)}"
          ${
            screen.id === selected
              ? "selected"
              : ""
          }
        >
          ${escapeHtml(screen.name)}
        </option>
      `
    )
    .join("");

}

/* =========================================================
   IMAGE FILE HANDLER
========================================================= */

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    function () {

      const file =
        this.files[0];


      if (!file) return;


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        toast(
          "Lütfen bir resim seç."
        );

        this.value = "";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          if (!selectedElement) {
            return;
          }


          selectedElement.image =
            event.target.result;


          pushHistory();

          render();

          toast(
            "Resim eklendi ✓"
          );

        };


      reader.onerror =
        function() {

          toast(
            "Resim okunamadı."
          );

        };


      reader.readAsDataURL(
        file
      );


      this.value = "";

    }
  );

/* =========================================================

========================================================= */

function addEvent() {

  if (!selectedElement) return;


  if (!selectedElement.events) {

    selectedElement.events = [];

  }


  selectedElement.events.push({

    trigger:
      selectedElement.type === "slider"
        ? "valueMatch"
        : selectedElement.type === "spinner"
          ? "timerEnd"
          : selectedElement.type === "switch"
            ? "switchOn"
            : selectedElement.type === "pin"
              ? "correctPin"
              : selectedElement.type === "terminal"
                ? "commandMatch"
                : selectedElement.type === "timer"
                  ? "timeUp"
                  : selectedElement.type === "osDialog"
                    ? "dialogConfirm"
                    : "click",

    command: selectedElement.type === "terminal" ? "help" : (selectedElement.type === "slider" ? "100" : ""),

    actions: []

  });


  pushHistory();

  renderPanel();

}


function removeEvent(
  index
) {
